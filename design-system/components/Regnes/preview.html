<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..700&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body)}
.lbl{font:500 11px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cv{display:block;width:100%;height:100%}
</style><style>.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:18px}
.t{border-radius:var(--radius-tile);overflow:hidden;display:grid;grid-template-rows:200px auto}
.t .in{padding:14px 18px 18px;display:grid;gap:4px}.t h3{margin:0;font:300 30px/1 var(--font-display);letter-spacing:-.03em}
.fa{background:var(--abyss);color:var(--on-dark)}.fl{background:var(--ground);color:var(--ink)}.br{background:var(--abyss);color:var(--on-dark)}
.t .lbl{color:inherit;opacity:.75}</style></head><body><div class="row">
 <div class="t fa"><canvas class="cv" id="a"></canvas><div class="in"><h3>Faune</h3><span class="lbl">rayon 0 · veine hair · cobalt</span></div></div>
 <div class="t fl"><canvas class="cv" id="b"></canvas><div class="in"><h3>Flore</h3><span class="lbl">rayon 26 · veine medium · lagon</span></div></div>
 <div class="t br"><canvas class="cv" id="c"></canvas><div class="in"><h3>Marque</h3><span class="lbl">rayon 40 · veine branch · le vide</span></div></div>
</div><script>Banbiom.field(document.getElementById("a"),{kind:"faune",seed:"regne-fa",cells:22,interactive:true});
Banbiom.field(document.getElementById("b"),{kind:"flore",seed:"regne-fl",cells:11,interactive:true});
Banbiom.field(document.getElementById("c"),{kind:"branche",seed:"regne-br",cells:8,interactive:true});</script></body></html>
