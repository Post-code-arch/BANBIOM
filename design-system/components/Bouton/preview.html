<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..700&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--font-body)}
.lbl{font:500 11px/1.2 var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cv{display:block;width:100%;height:100%}
</style><style>.row{display:flex;flex-wrap:wrap;gap:22px;padding:24px;align-items:center}
.b{border:0;cursor:pointer;font:500 15px/1 var(--font-body);display:grid;place-items:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
.b:hover{transform:translateY(-3px)}.b:active{transform:scale(.93);transition-duration:.08s}
.fa{background:var(--cobalt);color:var(--on-dark)}.fl{background:var(--lagoon);color:var(--on-light)}.br{background:var(--block-deep);color:var(--on-dark)}</style></head><body><div class="row">
 <button class="b fa" data-r="0" data-s="btn-fa" style="width:210px;height:66px">Explorer la faune</button>
 <button class="b fl" data-r="22" data-s="btn-fl" style="width:210px;height:66px">Explorer la flore</button>
 <button class="b br" data-r="24" data-s="btn-br" style="width:230px;height:66px">Ajouter une espèce</button>
</div><script>document.querySelectorAll(".b").forEach(function(b){var w=b.offsetWidth,h=b.offsetHeight;b.style.clipPath="path('"+Banbiom.cellPath(b.dataset.s,w,h,{radius:+b.dataset.r,sides:8,inset:1})+"')";});</script></body></html>
